[pytest]
# Where tests live and how they are discovered.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers.  Registering them here avoids "unknown mark" warnings and
# lets us select / deselect groups with `-m`.
#   integration — real HTTP tests that need the docker-compose stack running.
#                 Excluded from the default unit-test run with `-m "not integration"`.
markers =
    integration: end-to-end tests that hit a running Agentis stack (needs docker-compose up)

# Keep output readable; the asyncpg teardown RuntimeWarning during unittest
# IsolatedAsyncioTestCase cleanup is a known-harmless artifact.
filterwarnings =
    ignore::DeprecationWarning
