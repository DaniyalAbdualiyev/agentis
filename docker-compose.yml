services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: agentis
      POSTGRES_PASSWORD: agentis123
      POSTGRES_DB: agentisdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentis -d agentisdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentis:agentis123@postgres:5432/agentisdb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: on-failure

volumes:
  postgres_data:
